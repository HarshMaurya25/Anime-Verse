server:
  port: 11111

security:
  jwt:
    secret: #key

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - http://localhost:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

      server:
        webflux:
          routes:
            - id: authentication-service-route
              uri: http://auth-service:11112
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=2

            - id: user-service-api-docs
              uri: http://user-service:11113
              predicates:
                - Path=/api/user/v3/**
              filters:
                - StripPrefix=2

            - id: user-service
              uri: http://user-service:11113
              predicates:
                - Path=/api/user/**
              filters:
                - StripPrefix=2
                - JwtValidation
