spring:
  application:
    name: user-service

  datasource:
    url: #Url
    username: #USERNAME
    password: #PASSWORD

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 11113

springdoc:
  swagger-ui:
    config-url: /api/profile/v3/api-docs/swagger-config
    url: /api/profile/v3/api-docs
    path: /v3/swagger-ui
